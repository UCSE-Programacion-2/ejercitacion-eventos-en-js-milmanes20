# Defines autograding tests that run on every push via GitHub Actions.
name: Autograding Tests
on:
  push:
    branches: ["*"]
  workflow_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: "1. Vinculación de CSS y JS en index.html"
        id: 1-vinculaci-n-de-css-y-js-en-index-html-0
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "1. Vinculación de CSS y JS en index.html"
          command: "bash scripts/classroom-check.sh link-css-js"
          timeout: 2
          max-score: 1

      - name: "2. Consumo de API con fetch (Tarea 1)"
        id: 2-consumo-de-api-con-fetch-tarea-1-1
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "2. Consumo de API con fetch (Tarea 1)"
          command: "bash scripts/classroom-check.sh fetch-api"
          timeout: 2
          max-score: 1

      - name: "3. Renderizado dinámico de felinos en DOM (Tarea 2)"
        id: 3-renderizado-din-mico-de-felinos-en-dom-tarea-2-2
