          test-name: "3. Renderizado dinámico de felinos en DOM (Tarea 2)"
          command: "bash scripts/classroom-check.sh render-felinos"
          timeout: 2
          max-score: 1

      - name: "4. Alternar tema con botón (Tarea 3)"
        id: 4-alternar-tema-con-bot-n-tarea-3-3
        continue-on-error: true
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "4. Alternar tema con botón (Tarea 3)"
          command: "bash scripts/classroom-check.sh toggle-theme"
          timeout: 2
          max-score: 1

      - name: "5. Atajo de teclado teclas T o D (Tarea 4)"
        id: 5-atajo-de-teclado-teclas-t-o-d-tarea-4-4
